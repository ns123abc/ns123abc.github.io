name: Deploy

# Manual only until the Pages source is switched to GitHub Actions and the root HTML is retired.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # configure-pages calls GET /pages. Read is enough; this job cannot deploy.
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build.py reads "updated" dates from git history.
          fetch-depth: 0
          persist-credentials: false

      - name: Require build.py
        run: |
          if [ ! -f build.py ]; then
            echo "::error::build.py not found; nothing to deploy."
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest==9.2.0

      - name: Build
        run: python3 build.py

      - name: Test
        run: |
          if compgen -G "tests/test_*.py" > /dev/null; then
            python -m pytest -q tests
          else
            echo "::notice::No tests/test_*.py found; skipping tests."
          fi

      - name: Detect content/
        id: content
        run: |
          if [ -d content ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # content/ with an empty site/ is an error. A site/ with no HTML at all,
      # including when content/ is missing, is refused below before the upload.
      - name: Require site/ when content/ exists
        if: steps.content.outputs.present == 'true' && hashFiles('site/**') == ''
        run: |
          echo "::error::content/ exists but build.py wrote no site/."
          exit 1

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # build.py exits 0 and writes nothing when content/ is missing. Uploading
      # that empty tree would publish nothing and freeze GitHub Pages.
      - name: Refuse site/ with no HTML
        run: |
          if [ -d site ] && find site -name '*.html' -print -quit | grep -q .; then
            exit 0
          fi
          echo "::error::site/ has no HTML, so there is nothing to publish. build.py exits 0 and writes nothing when content/ is missing, and uploading that empty tree would freeze GitHub Pages. Stopping before upload-pages-artifact."
          exit 1

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
