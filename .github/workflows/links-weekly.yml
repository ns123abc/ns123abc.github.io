name: Links (weekly)

# Report-only: broken external links show up in the job summary and never fail anything.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-weekly
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect build.py
        id: guard
        run: |
          if [ -f build.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.guard.outputs.present == 'true'
        with:
          python-version: "3.12"

      - name: Build
        if: steps.guard.outputs.present == 'true'
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python3 build.py

      # build.py writes no site/ until content/ exists. Until then Pages serves
      # the root HTML, so that is what the external check has to read.
      - name: Choose pages
        id: target
        run: |
          if [ -d site ] && find site -name '*.html' -print -quit | grep -q .; then
            echo "glob=./site/**/*.html" >> "$GITHUB_OUTPUT"
          else
            echo "glob=./*.html" >> "$GITHUB_OUTPUT"
            echo "::notice::site/ has no HTML; checking the root pages GitHub Pages is serving."
          fi

      # --scheme limits the check to external http(s) links; internal links are build.py's job.
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --scheme https
            --scheme http
            --max-retries 2
            --timeout 20
            '${{ steps.target.outputs.glob }}'
          fail: false
          failIfEmpty: false
          jobSummary: true
